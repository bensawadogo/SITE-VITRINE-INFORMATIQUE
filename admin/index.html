<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Administration — AGO Tech Company</title>
  <style>
    /* Coquille légère pendant le chargement de Sveltia CMS (très rapide) */
    html, body { margin: 0; height: 100%; background: #f6f7f9; }
    .loading {
      display: flex; height: 100vh; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; font-family: system-ui, -apple-system, sans-serif;
      color: #3A5A72; font-size: 15px;
    }
    .spinner {
      width: 34px; height: 34px; border: 4px solid #e2e8f0; border-top-color: #E8520A;
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loading">
    <div class="spinner"></div>
    <div>Chargement de l’espace gérant…</div>
  </div>

  <!-- Sveltia CMS : l'interface s'affiche et remplace le loader automatiquement -->
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
</body>
</html>
